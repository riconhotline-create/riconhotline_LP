<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>特定商取引に基づく表記｜りこんほっとLINE</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#fff;
}

body{
  -webkit-touch-callout:none;
}


/* =========================
   FIXED HEADER
========================= */

.fixed-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:9999;

  background:#fff;

  box-shadow:
    0 1px 8px rgba(0,0,0,.06);
}

.header-inner{
  position:relative;

  width:100%;
  max-width:750px;

  margin:0 auto;

  line-height:0;
}

.header-inner img{
  display:block;

  width:100%;
  height:auto;

  margin:0;
  padding:0;

  -webkit-user-select:none;
  user-select:none;
  -webkit-user-drag:none;
}


/* =========================
   HEADER CLICK AREA
========================= */

.header-hit{
  position:absolute;

  display:block;

  left:84%;
  right:3%;

  top:12%;
  bottom:12%;

  z-index:10;
}


/* =========================
   PAGE
========================= */

.page{
  width:100%;
  max-width:750px;

  margin:0 auto;

  padding-top:124px;

  background:#fff;

  overflow:hidden;
}


/* =========================
   LEGAL IMAGE
========================= */

.legal-image{
  position:relative;

  display:block;

  width:100%;

  margin:0;
  padding:0;

  line-height:0;
}

.legal-image img{
  display:block;

  width:100%;
  height:auto;

  margin:0;
  padding:0;

  -webkit-user-select:none;
  user-select:none;
  -webkit-user-drag:none;
}


/* =========================
   LEGAL CLICK AREAS
========================= */

.legal-hit{
  position:absolute;

  display:block;

  z-index:20;
}


/* 個人情報保護法 */

.privacy-link{
  left:25%;
  right:25%;

  bottom:5.8%;
  height:2.2%;
}


/* 特定商取引に基づく表記 */

.transactions-link{
  left:20%;
  right:20%;

  bottom:3.5%;
  height:2.2%;
}


/* 利用規約 */

.terms-link{
  left:30%;
  right:30%;

  bottom:1.2%;
  height:2.2%;
}


/* =========================
   FOOTER
========================= */

.footer-home{
  display:block;

  width:100%;

  margin:0;
  padding:0;

  line-height:0;
}

.footer-home img{
  display:block;

  width:100%;
  height:auto;

  margin:0;
  padding:0;

  -webkit-user-select:none;
  user-select:none;
  -webkit-user-drag:none;
}


/* =========================
   FOCUS
========================= */

.header-hit:focus-visible,
.legal-hit:focus-visible,
.footer-home:focus-visible{
  outline:4px solid #1677ff;
  outline-offset:-4px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:750px){

  .page{
    padding-top:16.533333vw;
  }

}

</style>
</head>


<body>


<!-- =========================
     FIXED HEADER
========================= -->

<header class="fixed-header">

  <div class="header-inner">

    <img
      src="header.png"
      alt="りこんほっとLINE"
      draggable="false"
    >

    <a
      class="header-hit"
      href="https://liff.line.me/2006554413-HY306bDy/landing?follow=%40347rsnzd&lp=3m4kah&liff_id=2006554413-HY306bDy"
      aria-label="LINEを追加する"
    ></a>

  </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="page">


  <!-- =========================
       特定商取引に基づく表記
  ========================= -->

  <div class="legal-image">

    <img
      src="transactions.png"
      alt="特定商取引に基づく表記"
      draggable="false"
    >


    <!-- 個人情報保護法 -->

    <a
      class="legal-hit privacy-link"
      href="privacy.html"
      aria-label="個人情報保護法"
    ></a>


    <!-- 特定商取引に基づく表記 -->

    <a
      class="legal-hit transactions-link"
      href="transactions.html"
      aria-label="特定商取引に基づく表記"
    ></a>


    <!-- 利用規約 -->

    <a
      class="legal-hit terms-link"
      href="terms.html"
      aria-label="利用規約"
    ></a>

  </div>


  <!-- =========================
       FOOTER
  ========================= -->

  <a
    class="footer-home"
    href="index.html"
    aria-label="りこんほっとLINEトップページへ戻る"
  >

    <img
      src="footer.png"
      alt="りこんほっとLINE公式"
      draggable="false"
    >

  </a>


</main>


</body>
</html>
